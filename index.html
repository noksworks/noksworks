<title>Merve'nin Sihirli Dünyası ✨</title></head><body><script>
// DATA SYNC: Load from data.json first, fallback to localStorage
async function loadData() {
  const DEFAULT = {points:0,pointsLog:[],dailyQuest:'',shopping:[],potions:[],plants:[],goals:[],recipes:[],bookIdeas:[],spellbook:[],notes:[],dreams:[],reminders:[],prophetEntries:[],lastResetDate:null};
  try {
    const res = await fetch('/data.json');
    if (res.ok) {
      const remote = await res.json();
      const merged = Object.assign({}, DEFAULT, remote);
      localStorage.setItem('merve-dashboard', JSON.stringify(merged));
      return merged;
    }
  } catch(e) {}
  const saved = localStorage.getItem('merve-dashboard');
  return saved ? Object.assign({}, DEFAULT, JSON.parse(saved)) : DEFAULT;
}
</script>
